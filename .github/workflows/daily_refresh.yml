name: Forecast refresh

on:
  schedule:
    - cron: "15 */3 * * *"    # every 3 hours (UTC)
  workflow_dispatch:           # adds a manual "Run workflow" button

permissions:
  contents: write              # lets the job commit the refreshed data

concurrency:
  group: forecast-refresh      # never run two refreshes at the same time
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "pandas<3" requests pyarrow lightgbm

      - name: Fetch fresh data and recompute forecasts
        run: python src/refresh_forecast.py

      - name: Commit the refreshed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Forecast refresh $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin ${{ github.ref_name }}
          git push